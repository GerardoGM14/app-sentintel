<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SentinelaPyME: centralización y análisis en tiempo real de eventos de seguridad para pymes.">
  <title>Eventos · SentinelaPyME</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-pagina="eventos">
<main class="contenido" id="contenido" tabindex="-1">
  <div class="encabezado-pagina">
    <h1>Explorador de eventos</h1><p>Consulte los registros de seguridad recibidos. El rango máximo es de 31 días.</p>
  </div>
  <form id="form-filtros" class="filtros" aria-label="Filtros de eventos">
    <div class="campo"><label for="desde">Desde</label><input id="desde" name="desde" type="datetime-local"></div>
    <div class="campo"><label for="hasta">Hasta</label><input id="hasta" name="hasta" type="datetime-local"></div>
    <div class="campo"><label for="id_categoria">Categoría</label><select id="id_categoria" name="id_categoria"></select></div>
    <div class="campo"><label for="id_activo">Activo</label><select id="id_activo" name="id_activo"></select></div>
    <div class="campo"><label for="ip">IP de origen</label><input id="ip" name="ip" maxlength="45" placeholder="181.43.2.10"></div>
    <div class="acciones"><button class="btn" type="submit">Filtrar</button><button class="btn btn--secundario" type="reset">Limpiar</button></div>
  </form>
  <div class="aviso aviso--info oculto mt" id="aviso-nuevos" role="status"></div>
  <div class="tabla-contenedor mt">
    <table class="tabla tabla--apilable">
      <thead><tr><th>Fecha</th><th>Categoría</th><th>Severidad</th><th>Activo</th><th>IP origen</th><th>Usuario</th><th>Mensaje</th></tr></thead>
      <tbody id="tabla-eventos"><tr><td class="vacio" colspan="7">Cargando…</td></tr></tbody>
    </table>
  </div>
  <div class="paginacion"><span class="texto-suave texto-chico" id="resumen-eventos"></span><button class="btn btn--secundario oculto" id="btn-mas" type="button">Cargar más</button></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/core.js"></script>
<script src="/js/pages/eventos.js"></script>
</body>
</html>
