# Blueprint de Render (https://render.com/docs/blueprint-spec)
# Crea el servicio web Node.js y una base de datos PostgreSQL administrada.
services:
  - type: web
    name: sentinela-pyme
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentinela-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"          # conexión interna de Render; use "true" con Neon/Supabase
      - key: JWT_SECRET
        generateValue: true     # Render genera un secreto aleatorio
      - key: SEED_ON_START
        value: "true"           # carga datos de demostración en el primer arranque
      - key: SEED_EVENTOS
        value: "50000"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: sentinela-db
    plan: free
    databaseName: sentinela
    postgresMajorVersion: "16"
